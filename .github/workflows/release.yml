name: Release

# The filename is load-bearing. npm's trusted publisher for
# @storybook-community/storybook-dark-mode names this exact path
# (.github/workflows/release.yml) as the caller it will mint credentials for.
# Renaming or moving this file breaks publishing.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    # Declaring `permissions:` replaces the default set, so every scope the called
    # workflow needs must be listed here — unlisted ones drop to `none`, not to the
    # default, and a callee asking for more than the caller holds fails at startup.
    permissions:
      # Mints the OIDC token npm exchanges for short-lived publish credentials.
      id-token: write
      # Lets changesets/action push the version branch and tags.
      contents: write
      # Lets changesets/action open the "version packages" PR.
      pull-requests: write
    # Secretless. npm publishing already went through trusted publishing (OIDC) —
    # 7.1.3 carries a provenance attestation and the workflow that produced it had
    # no npm credential at all. The only token left was the org-level
    # CHANGESETS_GITHUB_TOKEN PAT, which expired in 2025 and broke every release;
    # this workflow uses the built-in GITHUB_TOKEN instead.
    #
    # storybook-community/.github ships no reusable release workflow (only the
    # setup-playwright action), so this borrows unional/.github, which is public
    # and is what storybook-addon-css-user-prefs already does.
    #
    # @v1, not @v2: the v2 line uses changesets/action@v2, which refuses to run
    # against @changesets/cli v2. This repo pins ^2.29.7. Moving to @v2 means
    # upgrading to @changesets/cli ^3 and @changesets/changelog-github ^1 first.
    uses: unional/.github/.github/workflows/pnpm-release-changeset-oidc.yml@v1
    with:
      node-version: '24'
