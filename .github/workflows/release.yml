name: Release

on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_PATH: ~/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v7

      - name: Prepare repository
        run: git fetch --unshallow --tags

      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install
      - name: Install playwright browsers
        uses: storybook-community/.github/.github/actions/setup-playwright@main
      - run: pnpm check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm cov
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          commit: 'chore: version packages'
          version: pnpm run version
          publish: pnpm run release
        env:
          # `@changesets/changelog-github` calls the GitHub API to build changelog
          # entries, so this needs a token that can read the repo.
          #
          # This deliberately does NOT read the org-level CHANGESETS_GITHUB_TOKEN.
          # That PAT expired and fails `changeset version` with a 401, which stopped
          # every release on this repo. A `secrets.X || secrets.GITHUB_TOKEN` fallback
          # does not help: Actions expressions fall through on an *empty* value, not a
          # *rejected* one, so a present-but-expired secret always wins the `||`.
          #
          # The built-in token can read this public repo, which is all the changelog
          # generator needs. `main` is unprotected here, so the version PR it opens has
          # no required checks to satisfy and still merges normally.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
